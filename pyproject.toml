# Maintainer scripts under scripts/. CI's scripts job and `make check-scripts`
# both read this file (uvx ruff / mypy), so local and CI apply the same rules.

[project]
# The workspace uv resolves for `uv run scripts/...`. Nothing is installed from
# it: each script carries its own PEP 723 header with the dependencies `uv run`
# gives it, and this table exists so the interpreter is declared rather than
# defaulted. Without a [project] table uv has no requires-python to read and
# picks its own default, which the lockfile then recorded, so the floor the
# maintainer scripts ran under was whatever uv shipped that week while mypy
# checked them against 3.11 and both headers asked for >=3.11.
#
# The version is a placeholder: nothing builds or installs this project, and
# the released version is stamped from the tag by the Makefile (VERSION).
name = "gauntlet-scripts"
version = "0.0.0"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["scripts"]

[tool.ruff.lint]
# Every category these two files already pass, plus pycodestyle errors at
# 100 columns and bandit. Defaults were E4/E7/E9/F only.
#
# Four of ruff's categories are deliberately absent, so the omission reads as
# a decision rather than an oversight. `COM` is trailing-comma and whitespace
# around it, which `ruff format` already settles; enabling both gives two
# tools an opinion about the same line. `T20` bans `print`, and printing is
# what these two scripts are for. `NPY` and `AIR` cover the NumPy and Airflow
# idioms, and nothing here imports either library, so the rules have no site
# to fire on and would only add to the list.
select = [
    "A",
    "ANN",
    "ARG",
    "ASYNC",
    "B",
    "BLE",
    "C4",
    "C90",
    "CPY",
    "D",
    "DTZ",
    "E",
    "EM",
    "ERA",
    "EXE",
    "F",
    "FA",
    "FAST",
    "FBT",
    "FIX",
    "FLY",
    "FURB",
    "G",
    "I",
    "ICN",
    "INP",
    "INT",
    "ISC",
    "LOG",
    "N",
    "PERF",
    "PGH",
    "PIE",
    "PL",
    "PT",
    "PTH",
    "PYI",
    "Q",
    "RET",
    "RSE",
    "RUF",
    "S",
    "SIM",
    "SLF",
    "SLOT",
    "T10",
    "TC",
    "TD",
    "TID",
    "TRY",
    "UP",
    "W",
    "YTT",
]

# D203 and D213 are each the negation of a rule the formatter's own output
# already settles (the blank line before a class, the summary line of a
# multi-line docstring). One of each pair is enough; ruff warns and silently
# drops the other, which puts a stderr line in every local run.
ignore = [
    "D203",
    "D213",
]

[tool.ruff.lint.flake8-copyright]
# The same two-line header every .go file opens with (AGENTS.md, "Tree
# conventions"), so the notice a script carries is the one the rest of the
# repository carries rather than a second spelling of it.
notice-rgx = 'Copyright \(C\) \d{4} Marcel W\. Wysocki'

[tool.ruff.lint.per-file-ignores]
# argv-form subprocess of `go` and the binary this script just built.
"scripts/suggest-calibrate.py" = ["S603"]

[tool.mypy]
python_version = "3.11"
strict = true
strict_bytes = true
strict_equality_for_none = true
extra_checks = true
local_partial_types = true
warn_unused_configs = true
disallow_any_explicit = true
disallow_any_decorated = true
disallow_any_unimported = true
warn_unreachable = true
enable_error_code = [
    "deprecated",
    "exhaustive-match",
    "explicit-override",
    "ignore-without-code",
    "mutable-override",
    "narrowed-type-not-subtype",
    "possibly-undefined",
    "redundant-expr",
    "redundant-self",
    "truthy-bool",
    "truthy-function",
    "truthy-iterable",
    "unimported-reveal",
    "unused-awaitable",
    "unused-coroutine",
]
files = ["scripts"]
