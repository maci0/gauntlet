# Maintainer scripts under scripts/. CI's scripts job and `make check-scripts`
# both read this file (uvx ruff / mypy), so local and CI apply the same rules.

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["scripts"]

[tool.ruff.lint]
# Every category these two files already pass, plus pycodestyle errors at
# 100 columns and bandit. Defaults were E4/E7/E9/F only.
select = [
    "A",
    "ANN",
    "ARG",
    "ASYNC",
    "B",
    "BLE",
    "C4",
    "DTZ",
    "E",
    "ERA",
    "EXE",
    "F",
    "FA",
    "FBT",
    "FLY",
    "FURB",
    "G",
    "I",
    "ICN",
    "INP",
    "ISC",
    "LOG",
    "N",
    "PERF",
    "PGH",
    "PIE",
    "PL",
    "PT",
    "PYI",
    "Q",
    "RET",
    "RSE",
    "RUF",
    "S",
    "SIM",
    "SLF",
    "SLOT",
    "TC",
    "TID",
    "UP",
    "W",
    "YTT",
]

[tool.ruff.lint.per-file-ignores]
# argv-form subprocess of `go` and the binary this script just built.
"scripts/suggest-calibrate.py" = ["S603"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["scripts"]
