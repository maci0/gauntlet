version: 2
updates:
  # Major versions stay in their own pull request: the Charm stack is adopted
  # through a dedicated migration pass, never bundled into a routine bump.
  # A major action is the same case, an action's major release can change
  # what a workflow does rather than only how it is spelled, so it gets read
  # on its own. The pull requests these groups do raise carry the pinned
  # commit SHA with them, so a bump is a reviewed change either way; what the
  # split stops is a new action's runtime landing under a patch that was
  # merged without reading it.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
