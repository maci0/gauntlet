name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Superseded runs on the same branch or pull request only burn runners: the
# result of an older commit tells nothing about the newer one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # The runner shells out to agents, locks directories, and kills process
        # groups, so both supported platforms run the real suite. Images are
        # pinned, not -latest: a runner-image rollout must not turn a green
        # tree red with no code change.
        os: [ubuntu-24.04, macos-15]
        # Both halves of the optional toktop integration are shipped, so both
        # are tested: with it the transcript readers run, without it gauntlet
        # must still build and fall back to what agents print.
        tags: [sqlite, "", notoktop]
    runs-on: ${{ matrix.os }}
    # A stuck agent under test must not hold the runner until GitHub's own
    # six-hour default expires.
    timeout-minutes: 30
    # This job runs the whole suite, which starts the agent CLIs a contributor
    # has installed and reads their transcripts, so anything in this
    # environment is reachable by those processes. No step here calls the API:
    # checkout persists no credentials, and every target below (check, test,
    # cover) reaches the module proxy and nothing else. The release job clears
    # the same two for the same reason, and there the token could write.
    env:
      GITHUB_TOKEN: ""
      GH_TOKEN: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # The `go` line in go.mod is a minimum; a release is built with one exact
          # compiler, so the pin lives in the Makefile (TestGoVersionPinMatchesCI).
          go-version: 1.27.1
      # check compiles all three tag configurations itself and every build
      # constraint in the tree is a tag constraint, never a GOOS one, so its
      # verdict is identical in all six cells: run it once per OS and let the
      # other four legs spend their runner minutes on `make test`.
      - run: make check
        if: matrix.tags == 'sqlite'
      # cover already runs the race suite, so the linux/sqlite cell does not
      # pay for the same tests a second time.
      - run: make test TAGS='${{ matrix.tags }}'
        if: matrix.tags != 'sqlite' || runner.os != 'Linux'
      # The floor ratchets: a change that drops a tested path fails here
      # rather than being noticed a release later.
      - run: make cover TAGS='${{ matrix.tags }}'
        if: matrix.tags == 'sqlite' && runner.os == 'Linux'

  # Maintainer scripts (the screenshot renderer, the suggester calibrator,
  # and shots.sh) gate the same way every other language in this repository
  # does, so they cannot rot into something nobody can run.
  scripts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Same rule the test job follows: a step that runs code must not inherit
    # a credential. uvx resolves and executes four tools from PyPI here, and
    # none of them calls the API, so both names are cleared. The job's own
    # permission is contents: read either way, and this is about not handing
    # it to a downloaded binary at all.
    env:
      GITHUB_TOKEN: ""
      GH_TOKEN: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # Pin uv itself, not just the tools it runs: this job's verdict must
          # depend on the commit, not on what uv released this week.
          version: "0.12.6"
          enable-cache: true
      # ruff, mypy, rich, and yamllint are pinned for the same reason every
      # other toolchain in the repository is: a new upstream release must not
      # turn a green tree red with no code change, and the two ruff steps must
      # never resolve different versions within one run. The rich pin must
      # match scripts/shots/render.py's PEP 723 header, which is what
      # `uv run` actually installs. Bump these pins deliberately in one
      # commit, running every step locally first; dependabot does not
      # track versions inside `run:` steps. Rule selection lives in
      # pyproject.toml, which both uvx ruff and a local ruff read, and in
      # .yamllint for the workflow step.
      - run: uvx ruff@0.16.4 check scripts
      - run: uvx ruff@0.16.4 format --check scripts
      # rich has type information, so mypy needs it installed to see it.
      - run: uvx --with rich==15.0.0 mypy@2.3.1 --strict scripts
      # A malformed workflow is a syntax error nothing else in this repository
      # can see: the Go build never reads it, and the job it breaks is the one
      # already running. .github rather than .github/workflows, so
      # dependabot.yml is covered by the same command. --strict makes a
      # warning fail, so the config carries no output nobody reads. Rule
      # selection lives in .yamllint.
      - run: uvx yamllint@1.38.0 --strict .github
      # Preinstalled on the Ubuntu runner image; shots.sh is the only shell
      # script in the tree. check-extra-masked-returns is off by default and
      # is the class where a command's failure is swallowed: a pipeline, a
      # test, or a process substitution that reports success while the work
      # inside it died.
      #
      # The one tool this job cannot install a pinned copy of, so the pin is
      # a record of the version the image is expected to carry rather than a
      # version the job fetches. `make check-scripts` compares the local copy
      # against the same value and warns on drift, and
      # TestScriptsToolPinsMatchCI keeps the two in step.
      - name: shell script lint
        env:
          SHELLCHECK_VERSION: "0.11.0"
        run: |
          echo "shellcheck $(shellcheck --version | awk '/^version:/ {print $2}') (pin ${SHELLCHECK_VERSION})"
          shellcheck --enable=check-extra-masked-returns scripts/shots.sh

  dist:
    runs-on: ubuntu-24.04
    # `make repro` gives each of its two tree copies its own build cache, so
    # every platform is compiled from cold on both sides; the previous bound
    # left too little room for that on a loaded runner.
    timeout-minutes: 30
    # Nothing in this job needs the API: checkout persists no credentials and
    # every target below (artifacts, smoke, repro) runs this tree's own code
    # against the module proxy. The test job and the release job clear both
    # names for the same reason, and there the token could write.
    env:
      GITHUB_TOKEN: ""
      GH_TOKEN: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # The `go` line in go.mod is a minimum; a release is built with one exact
          # compiler, so the pin lives in the Makefile (TestGoVersionPinMatchesCI).
          go-version: 1.27.1
      # checksums.txt and sbom.json are what a consumer verifies a download
      # against, and they were written only by a tagged release, so nothing
      # tested them until one shipped. `make artifacts` builds them from the
      # binaries just built and verifies the checksums against them, so both
      # files are exercised on every push instead of at the tag.
      #
      # Cross-compilation is part of the contract: `gauntlet update` can only
      # install a platform that actually builds, and it is this step that does
      # it. `artifacts` depends on `dist` and both are phony, so a `make dist`
      # of its own ahead of it would cross-compile all four platforms twice
      # and put a second cold build into every push.
      - run: make artifacts VERSION=ci
      # Linking is not running: a host binary that builds and then refuses to
      # start would pass dist and fail only when a tag runs the release smoke
      # test. The check is the Makefile's, so the job cannot drift from the one
      # a contributor runs before tagging, and the asset name stays owned by
      # host-artifact. Stamp is VERSION=ci, the same value dist just used.
      - run: make smoke VERSION=ci
      - run: test -s dist/sbom.json
      # A reproducibility claim nobody tests is decoration: same source, two
      # paths, different locale and TZ, must give byte-identical binaries, for
      # every platform dist ships.
      - run: make repro

  # `repro` archives and extracts the tree twice before it builds, so it runs
  # the host's tar and cmp as well as the Go toolchain. dist proved that on
  # Ubuntu; this leg is the same claim checked against BSD userland, where a
  # tar flag or a cmp exit code that means the same thing on GNU is the way a
  # reproducible release quietly stops being one.
  repro-macos:
    runs-on: macos-15
    # The same work the dist job's bound was widened for: eight cold
    # cross-compiles, two per platform, none of them sharing a build cache.
    # A timeout that fires half way through reports a failure nobody can
    # reproduce, since the source and the runner are both unchanged.
    timeout-minutes: 30
    # `make repro` builds and compares this tree's own code and reaches the
    # module proxy and nothing else, so neither token name is in reach of it.
    env:
      GITHUB_TOKEN: ""
      GH_TOKEN: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # The `go` line in go.mod is a minimum; a release is built with one exact
          # compiler, so the pin lives in the Makefile (TestGoVersionPinMatchesCI).
          go-version: 1.27.1
      - run: make repro
