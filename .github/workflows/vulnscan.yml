name: vulnscan

# Advisory scan of the dependency graph: govulncheck reports only
# vulnerabilities reachable from this codebase, which manifest-level
# dependabot alerts cannot. Scheduled weekly so drift between dependency
# bumps is caught, and on every go.mod/go.sum change so a bad bump is
# flagged while the diff is still under review. Runs with the default build
# tags, which pull in the widest graph including the sqlite driver's tree.

on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "go.mod"
      - "go.sum"
  push:
    branches: [main]
    paths:
      - "go.mod"
      - "go.sum"

permissions:
  contents: read

# The event name is in the group for the same reason as in ci.yml: this
# workflow cancels superseded runs, and a manual scan of main resolves to the
# ref the push that triggered it used, so without it the manual run stops the
# run it was asked to repeat.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # `make vuln` fetches govulncheck from the module proxy and runs it, so
    # this is the job that executes the most third-party code in the
    # repository. It talks to the advisory database and the proxy, never to
    # the API, so neither token name is in its environment. The test and
    # release jobs clear both for the same reason.
    env:
      GITHUB_TOKEN: ""
      GH_TOKEN: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # The `go` line in go.mod is a minimum; a release is built with one exact
          # compiler, so the pin lives in the Makefile (TestGoVersionPinMatchesCI).
          go-version: 1.27.1
          # The module cache, keyed on go.sum; the scanner resolves this
          # module's graph and govulncheck's own before either reports.
          cache: true
      # The tool is pinned against upstream replacement or an incompatible
      # release; govulncheck still reads the current advisory database.
      - run: make vuln
