name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

# Two tag pushes racing would both reach `gh release create`: serialize instead
# of canceling, because killing a half-published release loses assets that
# `gauntlet update` verifies against.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # Full race suite plus four-platform cross-compilation, with room to spare;
    # bounded so a hung step cannot sit on the tag for hours.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Publishing talks to the API through gh and GH_TOKEN; nothing here
          # needs git credentials, and this job's token can create releases.
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Build every platform
        run: make release VERSION="${GITHUB_REF_NAME#v}"

      # Smoke test before anything is uploaded: the host binary must run and
      # report the tagged version (it is stamped from the tag), and every asset
      # must match its line in checksums.txt. Verifying all of them catches a
      # corrupted cross-compile here rather than as a failed `gauntlet update`
      # checksum on that platform alone.
      - name: Smoke-test what would be published
        run: |
          version="${GITHUB_REF_NAME#v}"
          got="$(dist/gauntlet_${version}_linux_amd64 version)"
          echo "$got"
          if [ "$got" != "gauntlet $version" ]; then
            echo "smoke test failed: binary reports \"$got\", want \"gauntlet $version\"" >&2
            exit 1
          fi
          (cd dist && sha256sum -c checksums.txt)

      # Release notes are this version's CHANGELOG section: consumers read the
      # changelog, not the commit log. A tag without that section is a mistake
      # and fails here instead of publishing auto-generated notes.
      - name: Extract this version's CHANGELOG section
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            $0 == "## " ver { found = 1; next }
            /^## / && found { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! test -s notes.md; then
            echo "no CHANGELOG.md section for $version; add one before tagging" >&2
            exit 1
          fi

      # checksums.txt must ship with the binaries: `gauntlet update` refuses to
      # install an asset it cannot verify against it. sbom.txt is the module
      # inventory of what shipped, read back out of each built binary.
      #
      # A half-published release (created, then an upload died) makes
      # `gh release create` fail on every retry; the fallback clobbers the
      # existing assets instead, so re-running this workflow heals it. The
      # artifacts are reproducible and just passed the smoke test, so replacing
      # them is safe; if no release exists, upload also fails and the job
      # stays red.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --notes-file notes.md \
            dist/gauntlet_* dist/checksums.txt dist/sbom.txt ||
          gh release upload "$GITHUB_REF_NAME" --clobber \
            dist/gauntlet_* dist/checksums.txt dist/sbom.txt
