name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Verify the tag matches VERSION
        run: |
          version="${GITHUB_REF_NAME#v}"
          code_version=$(sed -n 's/^VERSION = "\([^"]*\)".*/\1/p' src/gauntlet/cli.py)
          if [ "$version" != "$code_version" ]; then
            echo "tag $GITHUB_REF_NAME does not match VERSION=$code_version in cli.py" >&2
            exit 1
          fi
      - name: Run tests
        run: python tests/test_gauntlet.py
      - name: Extract this version's CHANGELOG section
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            $0 == "## " ver { found = 1; next }
            /^## / && found { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! test -s notes.md; then
            echo "no CHANGELOG.md section for $version; add one before tagging" >&2
            exit 1
          fi
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
