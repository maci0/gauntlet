name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # release notes are generated from history
      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build every platform
        run: make release VERSION="${GITHUB_REF_NAME#v}"

      # checksums.txt must ship with the binaries: `gauntlet update` refuses to
      # install an asset it cannot verify against it.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes dist/gauntlet_* dist/checksums.txt
