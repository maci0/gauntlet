name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  # The attestation step signs with the runner's OIDC identity, which only
  # exists when id-token is granted, and uploads the signed statement to the
  # attestations API. Neither is the publish token, and neither is wanted by
  # any other step here.
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    # Formatting, vet, the full race suite, and four-platform
    # cross-compilation, with room to spare; bounded so a hung step cannot sit
    # on the tag for hours.
    timeout-minutes: 60
    # The job token can create releases. Keep it out of the environment for
    # checkout, setup-go, `make release` (which runs the test suite), and the
    # smoke test; Publish puts it back. gh and anything that reads
    # GITHUB_TOKEN then cannot talk to the API until that step.
    #
    # LC_ALL and TZ cover the steps the Makefile cannot: the publish step
    # globs dist/gauntlet_* outside make, and shell orders that expansion with
    # strcoll, so the asset order a release shows would follow the runner's
    # collation. The Makefile pins the same two for everything it runs.
    env:
      GITHUB_TOKEN: ""
      GH_TOKEN: ""
      LC_ALL: C
      TZ: UTC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Publishing talks to the API through gh and GH_TOKEN; nothing here
          # needs git credentials, and this job's token can create releases.
          persist-credentials: false
          # The ancestry check below reads main's history, which a clone of
          # one tag does not carry: fetch-depth 0 brings every branch, so
          # refs/remotes/origin/main is there to compare against.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # The `go` line in go.mod is a minimum; a release is built with one exact
          # compiler, so the pin lives in the Makefile (TestGoVersionPinMatchesCI).
          go-version: 1.27.1

      # Release notes are this version's CHANGELOG section: consumers read the
      # changelog, not the commit log. A tag without that section is a mistake
      # and fails here before spending time cross-compiling or running tests.
      #
      # Written under dist/, which is gitignored: `make release` refuses a
      # working tree carrying an untracked file, so notes.md in the checkout
      # root would stop the release it was extracted for.
      - name: Extract this version's CHANGELOG section
        run: |
          set -eu -o pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          awk -v ver="$version" '
            $0 == "## " ver { found = 1; next }
            /^## / && found { exit }
            found { print }
          ' CHANGELOG.md > dist/notes.md
          if ! awk '
            /^[[:space:]]*#+([[:space:]]|$)/ { next }
            /[^[:space:]]/ { content = 1 }
            END { exit !content }
          ' dist/notes.md; then
            echo "missing or empty CHANGELOG.md section for $version; add release notes before tagging" >&2
            exit 1
          fi

      # A tag is the entire release process, so two mistakes in one are worth
      # stopping before anything is built or uploaded. The first is a tag
      # older than what is already published: `releases/latest` is what both
      # `gauntlet update` and the README install resolve, so publishing one
      # hands every consumer an older version, and the immutable-release rule
      # below then refuses to put it back. The second is a tag on a commit
      # main does not carry: it publishes code the next release cut from main
      # silently reverts. A released heading and a tag correspond one to one,
      # so either mistake reaches this step with a CHANGELOG section to
      # extract, and the section alone cannot tell them apart.
      - name: Refuse a tag that is not a new release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu -o pipefail
          version="${GITHUB_REF_NAME#v}"
          base="${version%%+*}"
          # sort -V orders a prerelease below its final (1.26.0-rc.1 before
          # 1.26.0), so a release candidate is publishable and a stale
          # candidate is not, which is the same order a consumer's updater
          # resolves releases/latest in.
          latest="$(gh release list --limit 200 --json tagName --jq '.[].tagName' \
            | sed 's/^v//; s/+.*//' | sort -V | tail -1)"
          # An empty latest (the first release) leaves the empty line first and
          # the tag last, so only a tag below an existing release fails.
          newest="$(printf '%s\n%s\n' "$latest" "$base" | sort -V | tail -1)"
          if [ "$newest" != "$base" ]; then
            echo "tag $GITHUB_REF_NAME is older than the published v$latest; a release only ever moves forward" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "tag $GITHUB_REF_NAME is on a commit main does not carry;" \
              "the next release from main would revert it" >&2
            exit 1
          fi

      # A tag is what `gauntlet update` and the README install both serve, and
      # this workflow does not re-run the pull-request gates, so a tag is the
      # only review the bytes behind it can get. CONTRIBUTING says to cut it
      # from a commit main already carries; nothing here enforced that, and a
      # tag pushed from a side branch would publish unreviewed source under a
      # version the changelog and the attestation name as reviewed. `make
      # release` below still runs the suite, so this is about what reached a
      # pull request, not about whether the tree passes.
      #
      # HEAD is the commit the tag resolves to, so an annotated tag is read
      # through to its commit rather than compared as a tag object. The fetch
      # is the fallback for a checkout that did not bring the branch; the
      # repository is public and no credential is in this job's environment.
      - name: Refuse a tag that is not on main
        run: |
          git rev-parse --verify --quiet origin/main >/dev/null ||
            git fetch --quiet --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "$GITHUB_REF_NAME points at $(git rev-parse --short HEAD), which origin/main does not carry" >&2
            echo "cut the tag from a commit main already carries, or land the branch first" >&2
            exit 1
          fi

      - name: Build every platform
        run: make release VERSION="${GITHUB_REF_NAME#v}"

      # Smoke test before anything is uploaded: the host binary must run and
      # report the tagged version (it is stamped from the tag), which is the
      # Makefile's check, and every asset must match its line in
      # checksums.txt. Verifying all of them catches a corrupted cross-compile
      # here rather than as a failed `gauntlet update` checksum on that
      # platform alone.
      - name: Smoke-test what would be published
        run: |
          make smoke VERSION="${GITHUB_REF_NAME#v}"
          (cd dist && sha256sum -c checksums.txt)
          test -s dist/sbom.json

      # A checksum says which bytes this release shipped; it says nothing
      # about who built them. The provenance attestation is the signed record
      # of the workflow, the tag, and the source commit that produced each
      # binary, so a consumer can check both with `gh attestation verify
      # gauntlet_<platform> --repo maci0/gauntlet` instead of trusting the
      # release page. Every binary named in checksums.txt is attested, and
      # checksums.txt itself is not: it is the list, not an artifact.
      #
      # The step writes an attestation, not a release: the action reads the
      # token it needs from the workflow context, so the publish token stays
      # confined to the step below.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt

      # checksums.txt must ship with the binaries: `gauntlet update` refuses to
      # install an asset it cannot verify against it. sbom.json is the CycloneDX
      # inventory of what shipped, read back out of each built binary.
      #
      # Create a draft so a failed upload is never visible to consumers. A
      # retry may repair that draft, but an already-published version is
      # immutable: never replace its assets or notes.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          prerelease=false
          case "${GITHUB_REF_NAME%%+*}" in
            *-*) prerelease=true ;;
          esac
          draft="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [ "$draft" = false ]; then
            echo "release $GITHUB_REF_NAME is already published" >&2
            exit 1
          elif [ "$draft" = true ]; then
            gh release upload "$GITHUB_REF_NAME" --clobber \
              dist/gauntlet_* dist/checksums.txt dist/sbom.json
            gh release edit "$GITHUB_REF_NAME" --notes-file dist/notes.md \
              --prerelease="$prerelease" --draft=false
          else
            gh release create "$GITHUB_REF_NAME" --draft --notes-file dist/notes.md \
              --prerelease="$prerelease" \
              dist/gauntlet_* dist/checksums.txt dist/sbom.json
            gh release edit "$GITHUB_REF_NAME" --prerelease="$prerelease" --draft=false
          fi
