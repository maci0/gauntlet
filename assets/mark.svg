<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="gauntlet mark">
  <!-- Running the gauntlet: two facing rows of chevrons, the code's path arrowing through. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#64798a" stroke-width="10">
      <polyline points="16,28 28,44 40,28"/>
      <polyline points="52,28 64,44 76,28"/>
      <polyline points="88,28 100,44 112,28"/>
      <polyline points="16,100 28,84 40,100"/>
      <polyline points="52,100 64,84 76,100"/>
      <polyline points="88,100 100,84 112,100"/>
    </g>
    <g stroke="#0e96a8" stroke-width="11">
      <line x1="12" y1="64" x2="98" y2="64"/>
      <polyline points="84,48 102,64 84,80"/>
    </g>
  </g>
</svg>
